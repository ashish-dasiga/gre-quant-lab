<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="description" content="GRE Quantitative Reasoning self-study lab with topic-by-topic formula lessons, practice quizzes, and an integrated rough-work whiteboard.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   GRE Quant Lab — Design System (Editorial & Intentional, Anti-Slop)
   Crafted following taste-skill principles:
   - Restrained palette (color strictly on data & state, not decorative neon chrome)
   - Flat, architectural surfaces with crisp 1px hairlines (no heavy glowing blurs)
   - Generous typographic rhythm, clear hierarchy and balanced whitespace
   ========================================================================== */

:root {
  /* Dark Mode (Default) — Deep Obsidian / Slate */
  --bg: #0b0d13;
  --bg2: #12151f;
  --surface: #161a26;
  --surface2: #1c2132;
  --surface-hover: #21273b;
  --border: rgba(255, 255, 255, 0.08);
  --border2: rgba(255, 255, 255, 0.15);
  
  --text: #f1f3f9;
  --muted: #8e96ac;
  --faint: #596179;

  /* Primary Accent — Thoughtful Royal Indigo (Restrained, not neon) */
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-subtle: rgba(79, 70, 229, 0.12);
  --accent-text: #818cf8;

  /* State / Meaning Colors Only */
  --good: #10b981;
  --good-bg: rgba(16, 185, 129, 0.1);
  --good-border: rgba(16, 185, 129, 0.35);
  --bad: #f43f5e;
  --bad-bg: rgba(244, 63, 94, 0.1);
  --bad-border: rgba(244, 63, 94, 0.35);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 36px -8px rgba(0, 0, 0, 0.5);

  --radius: 14px;
  --radius-sm: 8px;
  --radius-lg: 18px;

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-h: 'Outfit', 'Inter', sans-serif;
  --font-m: 'STIX Two Text', 'Cambria Math', Cambria, Georgia, serif;
  
  --wb-h: 52vh;
  --wb-w: 44vw;

  color-scheme: dark;
}

:root[data-theme="light"] {
  /* Light Mode — Crisp Academic Paper */
  --bg: #f8fafc;
  --bg2: #f1f5f9;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --surface-hover: #f1f5f9;
  --border: rgba(15, 23, 42, 0.08);
  --border2: rgba(15, 23, 42, 0.16);

  --text: #0f172a;
  --muted: #475569;
  --faint: #94a3b8;

  --accent: #312e81;
  --accent-hover: #1e1b4b;
  --accent-subtle: rgba(49, 46, 129, 0.07);
  --accent-text: #3730a3;

  --good: #059669;
  --good-bg: rgba(5, 150, 105, 0.08);
  --good-border: rgba(5, 150, 105, 0.25);
  --bad: #e11d48;
  --bad-bg: rgba(225, 29, 72, 0.08);
  --bad-border: rgba(225, 29, 72, 0.25);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow: 0 4px 14px -3px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 12px 30px -6px rgba(15, 23, 42, 0.1);

  color-scheme: light;
}

/* ==========================================================================
   Base & Reset
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
}

body {
  font-family: var(--font);
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.65;
  font-size: 15px;
  margin: 0;
  padding: 0;
  transition: background-color 0.25s ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  touch-action: manipulation;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: rgba(79, 70, 229, 0.25);
}

/* ==========================================================================
   Layout Architecture
   ========================================================================== */
.app {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 120px;
  overflow-x: hidden;
  transition: margin 0.35s ease;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  margin: 0 -24px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-h);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
}

.brand-logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  display: grid;
  place-items: center;
  font-family: var(--font-m);
  font-style: italic;
  font-weight: 600;
  color: var(--text);
  font-size: 1.15rem;
}

.brand small {
  display: block;
  font-family: var(--font);
  font-weight: 500;
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: -2px;
}

.spacer {
  flex: 1;
}

.topbar-wb-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-weight: 600;
  font-size: 0.88rem;
  transition: all 0.15s ease;
  cursor: pointer;
  flex: none;
}

.topbar-wb-btn:hover {
  background: var(--surface-hover);
  border-color: var(--text);
}

.topbar-wb-btn svg {
  width: 16px;
  height: 16px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.15s ease;
}

.icon-btn:hover {
  background: var(--surface2);
  border-color: var(--border2);
  color: var(--text);
}

.icon-btn:active {
  transform: scale(0.96);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

/* ==========================================================================
   Surfaces & Cards (Flat, Clear, Architectural)
   ========================================================================== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.fade-in {
  animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ==========================================================================
   Hero & Overview Stats
   ========================================================================== */
.hero {
  padding: 32px 36px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 36px;
  align-items: center;
  margin-bottom: 32px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.hero h1 {
  font-family: var(--font-h);
  font-size: clamp(1.5rem, 3.8vw, 2.1rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  color: var(--text);
}

.hero p {
  color: var(--muted);
  font-size: 0.95rem;
  max-width: 58ch;
  line-height: 1.6;
}

.ring {
  position: relative;
  width: 120px;
  height: 120px;
}

.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring .track {
  stroke: var(--surface2);
  fill: none;
}

.ring .bar {
  fill: none;
  stroke: var(--accent);
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.ring-label {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.ring-label b {
  font-family: var(--font-h);
  font-size: 1.65rem;
  font-weight: 700;
  line-height: 1;
}

.ring-label span {
  font-size: 0.68rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0 22px;
}

.stat {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 0.82rem;
  color: var(--muted);
}

.stat b {
  display: block;
  color: var(--text);
  font-family: var(--font-h);
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.2;
}

/* ==========================================================================
   Buttons & Controls (Tactile & Grounded)
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.92rem;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  user-select: none;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--text);
  color: var(--bg);
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
  opacity: 0.92;
}

.btn-ghost {
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--text);
}

.btn-ghost:hover {
  background: var(--surface2);
  border-color: var(--text);
}

.btn-good {
  background: var(--good);
  color: #ffffff;
}

.btn-good:hover {
  opacity: 0.92;
}

.btn[disabled] {
  opacity: 0.35;
  pointer-events: none;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

/* ==========================================================================
   Chapters & Topic Cards
   ========================================================================== */
.chapter {
  margin: 36px 0 16px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.chapter h2 {
  font-family: var(--font-h);
  font-size: 1.18rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text);
}

.chapter span {
  color: var(--muted);
  font-size: 0.82rem;
}

.chapter::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.tcard {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.tcard:hover {
  border-color: var(--border2);
  background: var(--surface-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.tcard-top {
  display: flex;
  gap: 14px;
  align-items: center;
}

.ticon {
  width: 42px;
  height: 42px;
  flex: none;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 1.25rem;
  background: var(--surface2);
  border: 1px solid var(--border);
}

.tcard h3 {
  font-family: var(--font-h);
  font-size: 1.02rem;
  font-weight: 700;
  line-height: 1.3;
}

.tcard .num {
  font-size: 0.7rem;
  color: var(--faint);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.tcard p {
  font-size: 0.85rem;
  color: var(--muted);
  line-height: 1.5;
  flex: 1;
}

.pbar {
  height: 4px;
  border-radius: 2px;
  background: var(--surface2);
  overflow: hidden;
}

.pbar i {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  transition: width 0.6s ease;
}

.tmeta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.78rem;
  color: var(--muted);
  gap: 8px;
  padding-top: 4px;
}

.badge {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
}

.badge.ok {
  color: var(--good);
  background: var(--good-bg);
  border-color: var(--good-border);
}

.badge.go {
  color: var(--accent-text);
  background: var(--accent-subtle);
  border-color: transparent;
}

/* ==========================================================================
   Topic Header & Navigation Tabs
   ========================================================================== */
.thead {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 8px 0 24px;
}

.crumb {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 500;
  width: max-content;
}

.crumb:hover {
  color: var(--text);
}

.thead h1 {
  font-family: var(--font-h);
  font-size: clamp(1.5rem, 4vw, 2.1rem);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.2;
  display: flex;
  gap: 14px;
  align-items: center;
}

.tabs {
  display: inline-flex;
  padding: 4px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  gap: 4px;
  width: max-content;
  max-width: 100%;
}

.tab {
  padding: 8px 18px;
  border-radius: 7px;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--muted);
  display: flex;
  gap: 8px;
  align-items: center;
  transition: all 0.15s ease;
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
}

.tab small {
  font-size: 0.72rem;
  opacity: 0.8;
  font-weight: 600;
}

/* ==========================================================================
   Lesson Content & Academic Math Typography
   ========================================================================== */
.lesson {
  padding: clamp(24px, 4.5vw, 40px);
  background: var(--surface);
  border: 1px solid var(--border);
}

.lesson h3 {
  font-family: var(--font-h);
  font-size: 1.22rem;
  font-weight: 700;
  margin: 32px 0 12px;
  color: var(--text);
  letter-spacing: -0.015em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.lesson h3:first-child {
  margin-top: 0;
}

.lesson p {
  margin: 12px 0;
  color: var(--text);
  font-size: 0.98rem;
  line-height: 1.7;
}

.lesson ul, .lesson ol {
  margin: 12px 0 16px 24px;
}

.lesson li {
  margin: 8px 0;
  line-height: 1.65;
}

.lesson li::marker {
  color: var(--muted);
}

/* Clean, Scholarly Callouts */
.box {
  border-radius: var(--radius-sm);
  padding: 18px 22px;
  margin: 20px 0;
  border: 1px solid var(--border2);
  position: relative;
}

.box-t {
  font-family: var(--font-h);
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.box.formula {
  background: var(--surface2);
  border-left: 3px solid var(--text);
}

.box.formula .box-t {
  color: var(--text);
}

.box.tip {
  background: var(--accent-subtle);
  border-left: 3px solid var(--accent);
}

.box.tip .box-t {
  color: var(--accent-text);
}

.box.note {
  background: var(--surface2);
  border-left: 3px solid var(--muted);
}

.box.note .box-t {
  color: var(--muted);
}

.box .big {
  font-size: 1.25rem;
  text-align: center;
  padding: 10px 0;
}

/* Worked Examples Accordion */
details.ex {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin: 18px 0;
  background: var(--surface2);
  overflow: hidden;
  transition: border-color 0.2s ease;
}

details.ex[open] {
  border-color: var(--border2);
}

details.ex summary {
  list-style: none;
  cursor: pointer;
  padding: 16px 18px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 14px;
  align-items: center;
}

details.ex summary::-webkit-details-marker {
  display: none;
}

.ex-t {
  grid-column: 1 / -1;
  font-family: var(--font-h);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.ex-q {
  font-weight: 500;
  font-size: 0.96rem;
  line-height: 1.5;
}

.ex-btn {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--text);
  white-space: nowrap;
}

details.ex[open] .ex-btn {
  background: var(--border);
  color: var(--muted);
}

.ex-s {
  padding: 6px 18px 18px;
  border-top: 1px solid var(--border);
  font-size: 0.95rem;
  line-height: 1.7;
}

.lesson-end {
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: space-between;
  align-items: center;
}

/* ==========================================================================
   Math Typography Engine
   ========================================================================== */
.m {
  font-family: var(--font-m);
  font-size: 1.08em;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.m i {
  font-style: italic;
}

.m .o {
  padding: 0 0.22em;
}

.m sup, .m sub {
  font-size: 0.75em;
  line-height: 0;
}

.fr {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.9em;
  margin: 0 0.15em;
  line-height: 1.15;
}

.fr > .fn {
  border-bottom: 1.3px solid currentColor;
  padding: 0 0.2em 0.05em;
}

.fr > .fd {
  padding: 0.05em 0.2em 0;
}

.sq {
  white-space: nowrap;
}

.sq .sqc {
  border-top: 1.3px solid currentColor;
  padding: 0 0.12em;
  margin-left: 0.04em;
  display: inline-block;
  line-height: 1.2;
}

.sq .ri {
  font-size: 0.6em;
  vertical-align: 0.7em;
  margin-right: -0.32em;
}

.txt {
  font-family: var(--font);
  font-size: 0.92em;
}

/* ==========================================================================
   Quiz Screen (Clean, Focused, GRE Exam Feel)
   ========================================================================== */
.qwrap {
  display: grid;
  gap: 16px;
}

.qhead {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}

.qhead .count {
  font-family: var(--font-h);
  font-weight: 700;
  font-size: 1.05rem;
}

.qhead .count small {
  color: var(--muted);
  font-weight: 500;
}

.dots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.dot {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  font-size: 0.78rem;
  font-weight: 600;
  display: grid;
  place-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.15s ease;
}

.dot:hover {
  border-color: var(--border2);
  color: var(--text);
}

.dot.ok {
  background: var(--good-bg);
  color: var(--good);
  border-color: var(--good-border);
}

.dot.no {
  background: var(--bad-bg);
  color: var(--bad);

}

.dot.cur {
  border-color: var(--text);
  color: var(--text);

  font-weight: 700;
}

.qcard {
  padding: clamp(24px, 4.5vw, 36px);

  border: 1px solid var(--border);
}

.q-tag {

  font-weight: 700;

  gap: 8px;
  align-items: center;

.q-body {
  font-size: 1.08rem;
  line-height: 1.75;

.opts {
  display: grid;
  gap: 10px;

.opt {
  display: flex;
  align-items: center;
  gap: 16px;

  padding: 14px 18px;

  background: var(--surface);

  font-size: 1rem;
}

.opt:hover:not([disabled]) {
  border-color: var(--border2);
  background: var(--surface2);
}

.opt:active:not([disabled]) {
  transform: scale(0.99);
}

.opt .L {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.82rem;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--muted);
  transition: all 0.15s ease;
}

.opt.sel {
  border-color: var(--text);
  background: var(--surface2);
}

.opt.sel .L {
  background: var(--text);
  color: var(--bg);
  border-color: transparent;
}

.opt.right {
  border-color: var(--good);
  background: var(--good-bg);
}

.opt.right .L {
  background: var(--good);
  color: #ffffff;
  border-color: transparent;
}

.opt.wrong {
  border-color: var(--bad);
  background: var(--bad-bg);
}

.opt.wrong .L {
  background: var(--bad);
  color: #ffffff;
  border-color: transparent;
}

.opt[disabled] {
  cursor: default;
}

.numin {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.numin input {
  flex: 1;
  min-width: 160px;
  max-width: 260px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1.5px solid var(--border2);
  font-size: 1.1rem;
  font-family: var(--font-m);
  outline: none;
  transition: border-color 0.15s ease;
}

.numin input:focus {
  border-color: var(--text);
}

.numin input.right {
  border-color: var(--good);
  background: var(--good-bg);
}

.numin input.wrong {
  border-color: var(--bad);
  background: var(--bad-bg);
}

.numin .hint {
  font-size: 0.82rem;
  color: var(--muted);
  width: 100%;
}

.verdict {
  margin-top: 22px;
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  border: 1px solid;
  animation: fadeIn 0.25s ease both;
}

.verdict.ok {
  background: var(--good-bg);
  border-color: var(--good-border);
}

.verdict.no {
  background: var(--bad-bg);
  border-color: var(--bad-border);
}

.verdict h4 {
  font-family: var(--font-h);
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.verdict.ok h4 {
  color: var(--good);
}

.verdict.no h4 {
  color: var(--bad);
}

.verdict .exp {
  font-size: 0.96rem;
  line-height: 1.7;
}

.qnav {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 26px;
  flex-wrap: wrap;
}

.kbd-hint {
  font-size: 0.78rem;
  color: var(--faint);
  text-align: center;
  margin-top: 10px;
}

/* ==========================================================================
   Results Screen
   ========================================================================== */
.results {
  padding: 36px;
  text-align: center;
  display: grid;
  gap: 18px;
  justify-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
}

.results h2 {
  font-family: var(--font-h);
  font-size: 1.5rem;
  font-weight: 700;
}

.results p {
  color: var(--muted);

}

.results .ring {
  width: 140px;
  height: 140px;
}

/* ==========================================================================
   Formula Sheet View
   ========================================================================== */
.fs-topic {
  margin-bottom: 20px;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.fs-topic h3 {
  font-family: var(--font-h);
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.fs-topic h3 a {
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: 600;
}

.fs-topic h3 a:hover {
  color: var(--text);

.wb-sep {
  width: 1px;

.tool {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.15s ease;
}

.tool svg {
  width: 18px;
  height: 18px;
}

.tool:hover {
  border-color: var(--border2);
  color: var(--text);
}

.tool.active {
  background: var(--text);
  color: var(--bg);

}

.swatch {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  transition: transform 0.15s ease;

.swatch.active {
  transform: scale(1.15);

.size-ctl {
  flex: none;

}

.size-prev {

  height: 24px;

}

.size-prev i {
  display: block;

}

.size-val {

}

.wb-stage {
  position: relative !important;
  flex: 1 1 300px !important;
  min-height: 240px !important;
  margin: 0 14px 14px !important;
  border-radius: var(--radius-sm) !important;
  overflow: hidden !important;
  border: 1px solid var(--border2) !important;
  touch-action: none !important;
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;

  box-sizing: border-box !important;
}

.wb-stage.dark {

    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}

.wb-stage.paper {
  background-color: #fcfcfb;
  background-image: 
    linear-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

.wb-stage canvas {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;

  height: 100% !important;

  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;

  display: block !important;

.wb-stage.erasing canvas {
  cursor: cell !important;

.wb-empty {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  pointer-events: none !important;
  color: var(--faint) !important;

<h3>Single-Variable Linear Equations</h3>
<p>A linear equation in one variable has the standard form \(ax + b = c\) where \(a \ne 0\). The goal is always to isolate the variable by applying inverse operations to both sides.</p>

<F t="Solving Strategy">
<ol>
  <li><b>Clear fractions / parentheses:</b> Multiply by the LCD if fractions exist, or expand brackets.</li>
  <li><b>Collect variable terms:</b> Move all terms with the variable to one side, constants to the other.</li>
  <li><b>Isolate:</b> Divide by the variable's coefficient.</li>
</ol>
</F>

<EX t="Age Problem">
Peter's age 10 years from now will be twice his current age. How old is Peter today?
<SOL>
Let Peter's current age be \(p\).<br>
Equation: \(p + 10 = 2p\)<br>
Subtract \(p\) from both sides: \(10 = p\).<br>
Peter is <b>10 years old</b>.
</SOL>
</EX>

<h3>Two-Variable Systems & Word Problems</h3>
<p>When two unknown quantities are linked by two equations, you can solve using <b>elimination</b> or <b>substitution</b>. On the GRE, setting up a single variable using a total is often much faster!</p>

<TIP>
<b>One-Variable Shortcut for Mixture & Count Problems:</b><br>
If you have a total of \(10\) items consisting of pens at \(\$5\) and pencils at \(\$4\), total cost \(\$44\):<br>
Let pens \(= p\), then pencils \(= (10 - p)\).<br>
\(5p + 4(10 - p) = 44 \Rightarrow p + 40 = 44 \Rightarrow p = 4\). (Much faster than a \(2 \times 2\) system!)
</TIP>

<EX t="Ratio & Divisibility Trick">
Adam received \(\frac{1}{3}\) more votes than Peter. If the total votes were an integer, which of the following could be the total number of votes? (12, 13, 14, 15, 16)
<SOL>
Let Peter's votes be \(P\). Adam has \(P + \frac{1}{3}P = \frac{4}{3}P\).<br>
Total votes \(= P + \frac{4}{3}P = \frac{7}{3}P\).<br>
Since votes must be integers, \(P\) must be a multiple of \(3\), which makes Total a <b>multiple of 7</b>.<br>
Among the choices, only <b>14</b> is divisible by 7!
</SOL>
</EX>

TOPICS.push({
  id: 'quad',
  ch: 'alg',
  icon: '⚡',
  title: 'Quadratic Equations',
  desc: 'Factoring, quadratic formula, discriminant, nature of roots & Vieta\'s relations.',
  learn: R`
<h3>Standard Form of a Quadratic</h3>
<p>A quadratic equation has the standard form:</p>
<BIG>\(ax^2 + bx + c = 0 \quad (a \ne 0)\)</BIG>

<F t="The Quadratic Formula">
<BIG>\(x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}\)</BIG>
<p>The term inside the radical, \(D = b^2 - 4ac\), is called the <b>discriminant</b>.</p>
<ul>
  <li>\(D > 0\): Two distinct real roots.</li>
  <li>\(D = 0\): Exactly one real root (repeated / double root).</li>
  <li>\(D < 0\): No real roots.</li>
</ul>
</F>

<F t="Vieta's Formulas (Sum & Product of Roots)">
If \(r_1\) and \(r_2\) are roots of \(ax^2 + bx + c = 0\):
<BIG>\(r_1 + r_2 = -\frac{b}{a}, \qquad r_1 r_2 = \frac{c}{a}\)</BIG>
</F>

<TIP>
<b>Factoring by Splitting the Middle Term:</b><br>
To factor \(x^2 + 5x + 6 = 0\), find two numbers whose product is \(6\) and sum is \(5\): \(2\) and \(3\).<br>
\((x + 2)(x + 3) = 0 \Rightarrow x = -2, -3\).
</TIP>

<EX t="Finding an Unknown Coefficient">
If \(x = 4\) is a root of \(x^2 + kx - 8 = 0\), what is \(k\)?
<SOL>
Plug in \(x = 4\):<br>
\(4^2 + k(4) - 8 = 0 \Rightarrow 16 + 4k - 8 = 0 \Rightarrow 4k = -8 \Rightarrow k = -2\).
</SOL>
</EX>

TOPICS.push({
  id: 'sqrteq',

  icon: '√',
  title: 'Square Root Equations',
  desc: 'Radical equations, squaring both sides, domain restrictions & detecting extraneous roots.',
  learn: R`
<h3>Solving Radical Equations</h3>
<p>To solve an equation containing square roots, follow these fundamental rules:</p>

<F t="Three-Step Method">
<ol>
  <li><b>Isolate:</b> Get the radical term alone on one side of the equation.</li>
  <li><b>Square:</b> Square both sides to eliminate the radical.</li>
  <li><b>Check:</b> ⚠️ <b>MANDATORY:</b> Always test your answers in the original equation! Squaring both sides can introduce <i>extraneous solutions</i> that are invalid.</li>
</ol>
</F>

<NOTE>
<b>Definition of Principal Square Root:</b><br>
The symbol \(\sqrt{a}\) refers strictly to the <b>non-negative</b> square root. Thus \(\sqrt{9} = 3\), NEVER \(-3\) or \(\pm 3\).<br>
Likewise, \(\sqrt{(-3)^2} = \sqrt{9} = 3\).
</NOTE>

<EX t="Beware Extraneous Roots">
Solve \(\sqrt{x} = x - 2\).
<SOL>
Square both sides: \(x = (x - 2)^2 = x^2 - 4x + 4\).<br>
Rearrange: \(x^2 - 5x + 4 = 0 \Rightarrow (x - 4)(x - 1) = 0 \Rightarrow x = 4\) or \(x = 1\).<br>
<b>Check:</b>
<ul>
  <li>\(x = 4\): \(\sqrt{4} = 4 - 2 \Rightarrow 2 = 2\) ✓ Valid!</li>
  <li>\(x = 1\): \(\sqrt{1} = 1 - 2 \Rightarrow 1 = -1\) ✗ False! \(x = 1\) is extraneous.</li>
</ul>
The only valid solution is <b>\(x = 4\)</b>.
</SOL>
</EX>
`,

      e: R`Square both sides: \(x - 8 = 36 \Rightarrow x = 44\).<br>Check: \(\sqrt{44 - 8} = \sqrt{36} = 6\) ✓.`
    },

      o: [R`\(\pm 2\)`, R`\(2\) only`, R`\(-2\) only`, R`\(\pm 4\)`, R`No real solution`],
      e: R`Square both sides: \(x^2 + 21 = 25 \Rightarrow x^2 = 4 \Rightarrow x = \pm 2\).<br>Both check out in the original equation.`

      o: [R`\(4\) only`, R`\(4\) and \(-1\)`, R`\(-1\) only`, R`\(3\)`, R`\(2\)`],
      e: R`Cross-multiply: \(\sqrt{x(x - 3)} = 2\).<br>Square: \(x(x - 3) = 4 \Rightarrow x^2 - 3x - 4 = 0 \Rightarrow (x - 4)(x + 1) = 0\).<br>Since \(\sqrt{x}\) requires \(x \ge 0\), \(x = -1\) is extraneous. Thus \(x = 4\).`
    },

      o: [R`\(2\)`, R`\(-1\)`, R`\(2\) and \(-1\)`, R`\(\sqrt{2}\)`, R`\(0\)`],
      e: R`\(\sqrt{x^2 - 2} = \sqrt{x} \Rightarrow x^2 - 2 = x \Rightarrow x^2 - x - 2 = 0 \Rightarrow (x - 2)(x + 1) = 0\).<br>\(x = -1\) makes \(\sqrt{x}\) non-real. Thus the only real solution is \(x = 2\).`

TOPICS.push({
  id: 'ineq',

  title: 'Inequalities & Absolute Value',
  desc: 'Sign reversal rules, non-linear inequalities, distance definition of absolute value & compound ranges.',
  learn: R`
<h3>Rules of Inequalities</h3>
<p>Inequalities follow the same algebra rules as equations, with one crucial exception:</p>

<F t="Golden Rule of Inequalities">
When you <b>multiply or divide</b> both sides by a <b>negative number</b>, the inequality sign <b>REVERSES</b>!
<BIG>\(-2x < -14 \quad\Longrightarrow\quad x > 7\)</BIG>
</F>

<h3>Powers & Ranges</h3>
<ul>
  <li>If \(x > 1\): Higher powers increase: \(x^3 > x^2 > x > \sqrt{x}\).</li>
  <li>If \(0 < x < 1\): Higher powers <b>decrease</b>: \(\sqrt{x} > x > x^2 > x^3\).</li>
  <li>If \(x^2 > x\): This holds when \(x > 1\) OR \(x < 0\).</li>
</ul>

<h3>Absolute Value as Distance</h3>
<p>\(|x|\) represents the distance of \(x\) from \(0\) on the number line.</p>
<BIG>\(|x| = \begin{cases} x & \text{if } x \ge 0 \\ -x & \text{if } x < 0 \end{cases}\)</BIG>

<F t="Absolute Value Inequalities">
<ul>
  <li>\(|x - a| < k \iff a - k < x < a + k\) (within distance \(k\) of \(a\))</li>
  <li>\(|x - a| > k \iff x > a + k \text{ or } x < a - k\) (beyond distance \(k\) of \(a\))</li>
</ul>
</F>

<h3>Fundamental Laws of Exponents</h3>

<F t="Exponent Rules">
<ul>

  <li><b>Zero Power:</b> \(a^0 = 1 \quad (a \ne 0)\)</li>
  <li><b>Fractional Power:</b> \(a^{1/n} = \sqrt[n]{a}\), \quad \(a^{m/n} = (\sqrt[n]{a})^m\)</li>
</ul>
</F>

<TIP>
<b>Factoring Out Common Powers:</b><br>
When adding powers of the same base, do NOT multiply the bases! Instead, <b>factor out the smallest power</b>.<br>

\((8^{1/9})^{72} = 8^8\)<br>
Clearly, \(9^9 > 8^8\), so <b>\(9^{1/8} > 8^{1/9}\)</b>.
</SOL>
</EX>

For a quadratic function \(f(x) = ax^2 + bx + c\):

  <li>\(y = f(x - c)\): Shift RIGHT by \(c\)</li>
  <li>\(y = f(x + c)\): Shift LEFT by \(c\)</li>

TOPICS.push({

  desc: 'Prime factorization ladder, highest common factor, least common multiple & number of divisors.',
  learn: R`
<h3>Prime Numbers</h3>
<p>A prime number is an integer \(> 1\) whose only positive divisors are \(1\) and itself.</p>
<NOTE>
\(2\) is the <b>smallest prime</b> and the <b>only even prime</b>. \(1\) is NEITHER prime nor composite.
</NOTE>

<F t="Product Rule for HCF & LCM">
For any two positive integers \(a\) and \(b\):
<BIG>\(\text{HCF}(a, b) \times \text{LCM}(a, b) = a \times b\)</BIG>
<p>For consecutive integers \(n\) and \(n+1\), \(\text{HCF}(n, n+1) = 1\) (they are always co-prime).</p>
</F>

<F t="Number of Factors Formula">
If a number's prime factorization is \(N = p^a \cdot q^b \cdot r^c\):
<BIG>\(\text{Total Factors} = (a + 1)(b + 1)(c + 1)\)</BIG>
</F>

<EX t="Prime Factorization Ladder">
Find the prime factorization of \(2520\).
<SOL>

The sum of prime exponents is \(3 + 2 + 1 + 1 = \mathbf{7}\).
</SOL>
</EX>

TOPICS.push({

  learn: R`
<h3>Divisibility Tests</h3>
<ul>
  <li><b>Divisible by 3:</b> Sum of digits is divisible by 3.</li>
  <li><b>Divisible by 9:</b> Sum of digits is divisible by 9.</li>
  <li><b>Divisible by 4:</b> Last two digits form a number divisible by 4.</li>
  <li><b>Divisible by 8:</b> Last three digits form a number divisible by 8.</li>
  <li><b>Divisible by 6:</b> Number is both divisible by 2 (even) AND 3.</li>
</ul>

<F t="The Division Algorithm">
For any integer dividend \(N\), divisor \(D\), quotient \(Q\), and remainder \(R\):
<BIG>\(N = Q \cdot D + R \qquad (0 \le R < D)\)</BIG>
<p><i>Key insight:</i> \(N - R\) is always an exact multiple of \(D\)!</p>
</F>

<EX t="Finding an Unknown Number">
A number \(N\) between 30 and 35 is such that \(N - 3\) is divisible by 5. What is \(N\)?
<SOL>
Multiples of 5 near this range are \(25, 30, 35\).<br>
If \(N - 3 = 30 \Rightarrow N = 33\).<br>
Check: \(30 < 33 < 35\) ✓. Thus \(N = \mathbf{33}\).
</SOL>
</EX>
`,

    {

      ],

TOPICS.push({

<h3>Arithmetic Progression (AP)</h3>
<p>An AP has a constant difference \(d\) between consecutive terms: \(a, a+d, a+2d, \dots\)</p>

<F t="AP Formulas">
<ul>
  <li><b>\(n^{\text{th}}\) Term:</b> \(a_n = a + (n - 1)d\)</li>
  <li><b>Sum of \(n\) Terms:</b> \(S_n = \frac{n}{2}(a + l) = \frac{n}{2}[2a + (n - 1)d]\)</li>
  <li><b>Average of an AP:</b> \(\text{Average} = \text{Median} = \frac{\text{First} + \text{Last}}{2}\)</li>
</ul>
</F>

<F t="Counting Numbers in a Range">
<ul>
  <li><b>FROM \(a\) TO \(b\) (inclusive):</b> Count \(= b - a + 1\)</li>
  <li><b>BETWEEN \(a\) and \(b\) (exclusive):</b> Count \(= b - a - 1\)</li>
  <li><b>Number of Multiples of \(k\) from \(a\) to \(b\):</b> \(\frac{\text{Last Multiple} - \text{First Multiple}}{k} + 1\)</li>
</ul>
</F>

<h3>Geometric Progression (GP)</h3>
<p>A GP has a constant ratio \(r\) between consecutive terms: \(a, ar, ar^2, \dots\)</p>
<BIG>\(a_n = a \cdot r^{n - 1}\)</BIG>

<h3>Understanding Percentages</h3>
<p>A percentage is simply a fraction with denominator 100: \(p\% = \frac{p}{100}\).</p>

<p><b>Always remember:</b> The denominator is ALWAYS the <i>original / initial base value</i>!</p>

<F t="Successive Percentage Changes">
If a quantity changes by \(a\%\) and then by \(b\%\), the net percentage change is:
<BIG>\(\text{Net Change} = a + b + \frac{ab}{100}\)</BIG>

</EX>

TOPICS.push({

  desc: 'Work rates, simultaneous workers, pipes & cisterns, and the smart LCM unit method.',
  learn: R`
<h3>The Fundamental Work Equation</h3>
<BIG>\(\text{Rate} \times \text{Time} = \text{Work Completed}\)</BIG>
<p>If a person completes a job in \(T\) hours, their rate is \(\frac{1}{T}\) of the job per hour.</p>

<F t="Combined Work Formula">
If Person A takes \(a\) hours and Person B takes \(b\) hours to complete a job alone:
<BIG>\(T_{\text{together}} = \frac{a \cdot b}{a + b}\)</BIG>
</F>

<TIP>
<b>Smart LCM Unit Method:</b><br>
Instead of fractions, assign total work equal to \(\text{LCM}(a, b)\) units.<br>
<i>Example:</i> A does a job in 6 hours, B in 4 hours.<br>
Let Total Work \(= \text{LCM}(6, 4) = 12\) units.<br>
A's rate \(= 12 / 6 = 2\) units/hr. B's rate \(= 12 / 4 = 3\) units/hr.<br>
Together \(= 2 + 3 = 5\) units/hr. Time \(= \frac{12}{5} = 2.4\) hours!
</TIP>

<F t="Pipes & Cisterns">
Inflow pipes have positive rates, while drainage pipes have negative rates:
<BIG>\(\text{Net Rate} = R_{\text{in}} - R_{\text{out}}\)</BIG>
</F>

// 14. Time, Speed & Distance
TOPICS.push({
  id: 'tsd',
  ch: 'wp',

  title: 'Speed, Distance & Time',
  desc: 'Average speed traps, round-trip harmonic mean, relative motion & meeting point calculations.',
  learn: R`
<h3>Fundamental Speed Formula</h3>
<BIG>\(\text{Distance} = \text{Speed} \times \text{Time}\)</BIG>

<F t="Average Speed: The Golden Definition">
<BIG>\(\text{Average Speed} = \frac{\text{Total Distance}}{\text{Total Time}}\)</BIG>
<p>⚠️ <b>CRITICAL GRE TRAP:</b> NEVER simply take the arithmetic average of two speeds! Since more time is spent at the slower speed, the true average speed is always weighted closer to the slower speed.</p>
</F>

<F t="Round Trip with Equal Distances">
If an object travels a distance at speed \(v_1\) and returns along the same distance at speed \(v_2\):
<BIG>\(\text{Average Speed} = \frac{2 v_1 v_2}{v_1 + v_2}\)</BIG>
<p><i>Example:</i> 40 mph there and 60 mph back \(\Rightarrow \frac{2 \times 40 \times 60}{40 + 60} = \frac{4800}{100} = \mathbf{48\text{ mph}}\) (NOT 50!).</p>
</F>

<F t="Relative Motion">
<ul>
  <li><b>Moving towards each other:</b> Relative Speed \(= v_1 + v_2\)</li>
  <li><b>Moving in same direction:</b> Relative Speed \(= |v_1 - v_2|\)</li>
</ul>
</F>
`,

// 15. Simple & Compound Interest
TOPICS.push({

  desc: 'Simple interest formula, compound growth multipliers, and quarterly/monthly compounding rates.',
  learn: R`
<h3>Simple Interest (SI)</h3>
<p>Interest is calculated only on the initial principal \(P\):</p>
<BIG>\(SI = \frac{P \cdot R \cdot N}{100}\)</BIG>
<BIG>\(\text{Total Amount } A = P + SI = P\left(1 + \frac{R \cdot N}{100}\right)\)</BIG>

<F t="Compound Interest (CI)">
Interest is added back to principal at each compounding interval:
<BIG>\(A = P\left(1 + \frac{R}{100}\right)^N\)</BIG>
<ul>
  <li><b>Compounded Semi-Annually:</b> Rate \(= \frac{R}{2}\%\), Periods \(= 2N\)</li>
  <li><b>Compounded Quarterly:</b> Rate \(= \frac{R}{4}\%\), Periods \(= 4N\)</li>
  <li><b>Compounded Monthly:</b> Rate \(= \frac{R}{12}\%\), Periods \(= 12N\)</li>
</ul>
</F>

<EX t="Quarterly Compounding">
Find the compound interest on \(\$5000\) at \(12\%\) per annum compounded quarterly for 6 months.
<SOL>
Quarterly rate \(r = \frac{12\%}{4} = 3\%\).<br>
Number of quarters in 6 months \(= 2\).<br>
\(A = 5000(1 + 0.03)^2 = 5000 \times 1.0609 = \$5304.50\).<br>
Compound Interest \(= A - P = \$304.50\).
</SOL>
</EX>
`,
  quiz: [
    {
      q: R`A sum of \(\$1000\) was split and invested: part at \(5\%\) simple interest per annum and the rest at \(10\%\) simple interest per annum. If the total interest earned after 1 year was \(\$75\), how much was invested at \(5\%\)?`,

      e: R`Let \(x\) be amount at \(5\%\). Amount at \(10\%\) is \(1000 - x\).<br>\(0.05x + 0.10(1000 - x) = 75 \Rightarrow 100 - 0.05x = 75 \Rightarrow 0.05x = 25 \Rightarrow x = \$500\).`

<p>For any two overlapping groups \(A\) and \(B\):</p>

</ul>

<p>When dealing with two binary categories (e.g. Male/Female and French/German), a 2×2 grid ensures no terms are double-counted!</p>

TOPICS.push({
  id: 'mmm',
  ch: 'da',
  icon: '📊',
  title: 'Mean, Median & Mode',
  desc: 'Arithmetic mean, weighted averages, median calculation, and frequency distributions.',
  learn: R`
<h3>Measures of Central Tendency</h3>

<F t="Arithmetic Mean & Sum">
<BIG>\(\text{Mean} = \frac{\sum x}{n} \quad\iff\quad \sum x = n \times \text{Mean}\)</BIG>
<p><i>Golden Rule:</i> Whenever an average is given or changes, immediately calculate the <b>TOTAL SUM</b>!</p>
</F>

<F t="Weighted Average">
When combining two groups with averages \(x_1\) and \(x_2\) and counts \(w_1\) and \(w_2\):
<BIG>\(\bar{x}_{\text{weighted}} = \frac{w_1 x_1 + w_2 x_2}{w_1 + w_2}\)</BIG>
<p>The weighted average is ALWAYS pulled closer to the group with the larger count.</p>
</F>

<h3>Median & Mode</h3>
<ul>
  <li><b>Median:</b> The middle value when data is sorted in ascending order.
    <ul>
      <li>If \(n\) is odd: The exact middle value at position \(\frac{n+1}{2}\).</li>
      <li>If \(n\) is even: The average of the two middle values at positions \(\frac{n}{2}\) and \(\frac{n}{2} + 1\).</li>
    </ul>
  </li>
  <li><b>Mode:</b> The value that appears with the highest frequency. A set can have one mode, multiple modes, or no mode.</li>
</ul>

<NOTE>
In any evenly spaced sequence (Arithmetic Progression), <b>\(\text{Mean} = \text{Median} = \frac{\text{First} + \text{Last}}{2}\)</b>.
</NOTE>
`,
  quiz: [
    {
      q: R`The average of 5 positive numbers is 40. When 2 of the numbers are removed, the average of the remaining 3 numbers is 50. What is the average of the 2 removed numbers?`,

      e: R`Initial sum \(= 5 \times 40 = 200\).<br>Remaining sum \(= 3 \times 50 = 150\).<br>Sum of 2 removed numbers \(= 200 - 150 = 50\).<br>Their average \(= \frac{50}{2} = 25\).`

      q: R`The ratio of male to female students in a college program is \(1:2\). If the mean score of the male students is 120 and the mean score of the female students is 135, what is the combined mean score of all students?`,

TOPICS.push({

  desc: 'Dispersion metrics, variance formula, transformation rules & visual spread comparison.',
  learn: R`
<h3>Measures of Spread</h3>
<ul>
  <li><b>Range:</b> \(\text{Max} - \text{Min} \ge 0\).</li>
  <li><b>Standard Deviation (\(\sigma\)):</b> Measures how spread out numbers are from the mean.
    <BIG>\(\sigma = \sqrt{\frac{\sum (x_i - \mu)^2}{n}}\)</BIG>
  </li>
  <li><b>Variance:</b> \(\text{Variance} = \sigma^2\).</li>
</ul>

<F t="Effects of Operations on Range & SD">
<ol>
  <li><b>Adding or Subtracting a Constant \(k\):</b><br>
    The entire distribution shifts, but distances between points remain unchanged!<br>
    \(\text{Range}_{\text{new}} = \text{Range}_{\text{old}}\)<br>
    \(\sigma_{\text{new}} = \sigma_{\text{old}}\) (UNALTERED!)
  </li>
  <li><b>Multiplying by a Constant \(k\):</b><br>
    Distances between points scale by \(|k|\):<br>
    \(\text{Range}_{\text{new}} = |k| \times \text{Range}_{\text{old}}\)<br>
    \(\sigma_{\text{new}} = |k| \times \sigma_{\text{old}}\)
  </li>
</ol>
</F>
`,
  quiz: [
    {
      q: R`The range of a dataset is 20. If every number in the dataset is increased by 30, what is the new range?`,
      o: [R`\(20\)`, R`\(50\)`, R`\(30\)`, R`\(10\)`, R`\(0\)`],
      e: R`Adding a constant to every value shifts the entire set but does not change the difference between max and min: \((M + 30) - (m + 30) = M - m = 20\).`
    },
    {
      q: R`Which of the following datasets has the greatest standard deviation?`,
      o: [
        R`\(\{20, 30, 40, 50\}\)`,
        R`\(\{1, 4, 7, 10\}\)`,
        R`\(\{2, 4, 6, 8\}\)`,
        R`\(\{12, 13, 14, 15\}\)`,
        R`\(\{-8, -6, -4, -2\}\)`
      ],
      e: R`Standard deviation measures distance from the mean. The spacing between consecutive terms in \(\{20, 30, 40, 50\}\) is 10, whereas in all other choices it is 3, 2, or 1. Thus it has the largest spread.`
    },
    {
      q: R`Which of the following operations on a dataset will leave its standard deviation UNCHANGED?
I. Increasing the largest number by 10
II. Increasing each number by 10
III. Multiplying each number by 10`,
      o: [R`II only`, R`I only`, R`III only`, R`II and III`, R`None of them`],
      fix: 1, a: 0,
      e: R`Only adding the same constant to EVERY number (II) shifts the data without altering the deviations from the mean.`
    },
    {
      q: R`What is the standard deviation and range of the set \(\{1, 5, 9, 13\}\)?`,
      o: [
        R`\(\text{SD} = \sqrt{20}, \text{Range} = 12\)`,
        R`\(\text{SD} = 20, \text{Range} = 12\)`,
        R`\(\text{SD} = \sqrt{10}, \text{Range} = 12\)`,
        R`\(\text{SD} = 4, \text{Range} = 13\)`,

TOPICS.push({

  learn: R`
<h3>Selection vs Arrangement</h3>

<F t="Combinations: Order Does NOT Matter">
Selecting \(r\) items out of \(n\) distinct items (e.g. committees, handshakes):
<BIG>\(^nC_r = \frac{n!}{r!(n - r)!}\)</BIG>
<ul>
  <li>\(^nC_1 = n\), \quad \(^nC_n = 1\), \quad \(^nC_0 = 1\)</li>
  <li>\(^nC_2 = \frac{n(n - 1)}{2}\)</li>
</ul>
</F>

<F t="Permutations: Order MATTERS">
Arranging \(r\) items out of \(n\) distinct items (e.g. ranks, podiums, words):
<BIG>\(^nP_r = \frac{n!}{(n - r)!}\)</BIG>
<ul>
  <li>Arranging \(n\) items in a straight line: \(n!\)</li>
  <li>Arranging \(n\) items in a circle: \((n - 1)!\)</li>
</ul>
</F>

<TIP>
<b>The Box / Glue Method (Items Kept Together):</b><br>
To arrange letters of "BEGIN" such that vowels (E, I) are always together:<br>
1. Glue {E, I} into 1 block. Total items to arrange: {B, G, N, [EI]} \(= 4\) items \(\Rightarrow 4! = 24\).<br>
2. Arrange vowels internally: \(2! = 2\).<br>
Total \(= 4! \times 2! = 24 \times 2 = \mathbf{48}\).
</TIP>
`,

TOPICS.push({

<h3>Basic Probability</h3>
<BIG>\(P(E) = \frac{\text{Number of Favorable Outcomes}}{\text{Total Possible Outcomes}} \qquad (0 \le P(E) \le 1)\)</BIG>
<p><b>Complementary Rule:</b> \(P(\text{not } E) = 1 - P(E)\). (Very useful when asked for "at least one"!).</p>

<F t="Compound Events">
<ul>
  <li><b>Independent Events (AND rule):</b> Both happen:
    <BIG>\(P(A \text{ and } B) = P(A) \times P(B)\)</BIG>
  </li>
  <li><b>Mutually Exclusive Events:</b> Cannot happen together (\(P(A \cap B) = 0\)):
    <BIG>\(P(A \text{ or } B) = P(A) + P(B)\)</BIG>
  </li>
  <li><b>General OR Rule (Overlapping):</b>
    <BIG>\(P(A \text{ or } B) = P(A) + P(B) - P(A \text{ and } B)\)</BIG>
  </li>
</ul>
</F>
`,

      e: R`\(P(\text{even}) = \frac{3}{6} = \frac{1}{2}\). \(P(\text{odd}) = \frac{3}{6} = \frac{1}{2}\).<br>Independent: \(\frac{1}{2} \times \frac{1}{2} = \frac{1}{4}\).`

TOPICS.push({
  id: 'coord',
  ch: 'geo',
  icon: '📍',
  title: 'Coordinate Geometry',
  desc: 'Distance formula, midpoints, slope rules, linear intercepts, perpendicular lines & circles.',
  learn: R`
<h3>Cartesian Plane & Formulas</h3>

<F t="Essential Coordinate Formulas">
Given two points \((x_1, y_1)\) and \((x_2, y_2)\):
<ul>
  <li><b>Distance:</b> \(d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}\)</li>
  <li><b>Midpoint:</b> \(M = \left(\frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2}\right)\)</li>
  <li><b>Slope (\(m\)):</b> \(m = \frac{y_2 - y_1}{x_2 - x_1}\)</li>
</ul>
</F>

<F t="Slopes of Parallel & Perpendicular Lines">
<ul>
  <li><b>Parallel Lines:</b> Have identical slopes: \(m_1 = m_2\)</li>
  <li><b>Perpendicular Lines:</b> Slopes are negative reciprocals: \(m_1 \cdot m_2 = -1 \iff m_2 = -\frac{1}{m_1}\)</li>
  <li><b>Horizontal Line (\(y = c\)):</b> Slope is \(0\)</li>
  <li><b>Vertical Line (\(x = k\)):</b> Slope is <i>undefined</i></li>
</ul>
</F>

<F t="Equation of a Circle">
A circle with center \((h, k)\) and radius \(r\):
<BIG>\((x - h)^2 + (y - k)^2 = r^2\)</BIG>
</F>
`,

<p>When two parallel lines are intersected by a transversal:</p>

<F t="The Triangle Inequality Theorem">

<BIG>\(|a - b| < c < a + b\)</BIG>

  <li><b>Parallelogram:</b> Area \(= \text{base} \times \text{height}\). Diagonals bisect each other.</li>

    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="card modal" role="dialog" aria-label="Settings"><h2>Settings & progress</h2>
      <p>Progress is saved automatically in this browser on this device${storageOK ? '' : ' — <b style="color:var(--bad)">but storage is blocked here, so it will not persist. Open the file in Chrome/Safari directly.</b>'}.</p>
      <div class="switch-row"><span>Light theme</span><button class="btn btn-ghost" id="themeT">${S.theme === 'light' ? 'On' : 'Off'}</button></div>
      <h4>📤 Backup / move progress</h4><p>Copy this code and paste it into the app on another device (e.g. your phone) to carry your progress over.</p>
      <textarea id="expCode" readonly>${code}</textarea><div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost" id="copyCode">Copy code</button></div>
      <h4>📥 Restore from code</h4><textarea id="impCode" placeholder="Paste a backup code here"></textarea>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary" id="impBtn">Restore</button></div>
      <h4>📱 Using it on your phone</h4><p><b>Android:</b> send the HTML file to yourself, download it, then open it with Chrome (Files → tap → Open with Chrome). <b>iPhone:</b> the Files preview can't save progress — upload the file to any free static host (e.g. Netlify Drop, GitHub Pages) and open the link in Safari; "Add to Home Screen" makes it feel like an app.</p>
      <h4 style="color:var(--bad)">Danger zone</h4><div class="btn-row"><button class="btn btn-ghost" id="resetAll">Reset all progress</button><button class="btn btn-ghost" id="clearBoards">Clear all whiteboards</button></div>
      <div class="btn-row" style="margin-top:20px;justify-content:flex-end"><button class="btn btn-primary" id="closeM">Done</button></div></div>`;
    document.body.appendChild(bg);
    bg.onclick = e => { if (e.target === bg) closeModal(); };
    $('#closeM').onclick = closeModal;
    $('#themeT').onclick = () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; applyTheme(); save(); $('#themeT').textContent = S.theme === 'light' ? 'On' : 'Off'; WB.redraw(); };
    $('#copyCode').onclick = () => { const ta = $('#expCode'); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Backup code copied'), () => { document.execCommand('copy'); toast('Backup code copied'); }); };
    $('#impBtn').onclick = () => {
      try { const s = JSON.parse(decodeURIComponent(escape(atob($('#impCode').value.trim())))); if (!s || s.v !== 1) throw 0; S = Object.assign(fresh(), s); save(); applyTheme(); closeModal(); QV.id = null; route(); toast('✅ Progress restored'); }
      catch (e) { toast('That code is not valid'); }
    };
    $('#resetAll').onclick = () => { if (!confirm('Erase ALL quiz progress? This cannot be undone.')) return; const th = S.theme; S = fresh(); S.theme = th; save(); QV.id = null; closeModal(); route(); toast('Progress reset'); };
    $('#clearBoards').onclick = () => { if (!confirm('Erase every whiteboard drawing?')) return; WB.clearAll(); toast('All whiteboards cleared'); };
  }

  /* ---------------- Whiteboard ---------------- */
  const WB = (() => {
    const COLORS = ['ink', '#818cf8', '#38bdf8', '#34d399', '#fbbf24', '#f87171', '#94a3b8'];
    const PK = 'greql_wbpref', BK = 'greql_wb_';
    let pref = { tool: 'pen', color: 'ink', pen: 3, eraser: 28, paper: false, h: 60, big: false };
    try { Object.assign(pref, JSON.parse(localStorage.getItem(PK) || '{}')); } catch (e) { }
    if (typeof pref.h !== 'number' || isNaN(pref.h) || pref.h < 30 || pref.h > 95) {
      pref.h = 60;
    }
    let el, stage, cv, ctx, dpr = 1, W = 0, H = 0, key = null, strokes = [], redoS = [], cur = null;
    let isDrawing = false, activeId = null, isOpen = false, lastCleared = null;
    const savePref = () => { try { localStorage.setItem(PK, JSON.stringify(pref)); } catch (e) { } };
    const ink = c => c === 'ink' ? (pref.paper ? '#1b1f3a' : '#f1f3ff') : c;
    const icon = {
      pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
      eraser: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>',
      undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
      redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
      paper: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>',
      expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    };
    function build() {
      el = $('#wb');
      el.innerHTML = `<div class="wb-handle" id="wbHandle" title="Drag to resize"><i></i></div>
        <div class="wb-bar">
          <button class="tool" id="wbClose" title="Close board (Esc)">${icon.close}</button>
          <div class="wb-title">✏️ Rough work <small id="wbName"></small></div><span class="wb-sep"></span>
          <button class="tool" id="wbPen" title="Pen">${icon.pen}</button><button class="tool" id="wbEraser" title="Eraser">${icon.eraser}</button>
          <span class="wb-sep"></span>
          ${COLORS.map((c, k) => `<button class="swatch" id="wbC${k}" data-c="${c}" title="Ink colour" style="background:${c === 'ink' ? 'linear-gradient(135deg,#f1f3ff 50%,#1b1f3a 50%)' : c}"></button>`).join('')}
          <span class="wb-sep"></span>
          <label class="size-ctl" title="Size"><span class="size-prev"><i id="wbPrev"></i></span><input type="range" id="wbSize" min="1" max="40" aria-label="Ink size"><span class="size-val" id="wbVal"></span></label>
          <span class="wb-sep"></span>
          <button class="tool" id="wbUndo" title="Undo">${icon.undo}</button><button class="tool" id="wbRedo" title="Redo">${icon.redo}</button>
          <button class="tool" id="wbClear" title="Clear board">${icon.trash}</button>
          <button class="tool" id="wbPaper" title="Dark / paper background">${icon.paper}</button><button class="tool" id="wbBig" title="Bigger board">${icon.expand}</button>
        </div>
        <div class="wb-stage" id="wbStage"><canvas id="wbCanvas"></canvas><div class="wb-empty" id="wbEmpty">Scribble your rough work here ✍️<br>Pick pen size & colour above · use the eraser to fix mistakes</div></div>`;
      stage = $('#wbStage'); cv = $('#wbCanvas'); ctx = cv.getContext('2d');
      $('#wbClose').onclick = close;
      $('#wbPen').onclick = () => setTool('pen'); $('#wbEraser').onclick = () => setTool('eraser');
      $$('.swatch', el).forEach(s => s.onclick = () => { pref.color = s.dataset.c; setTool('pen'); });
      $('#wbSize').oninput = e => { pref[pref.tool] = +e.target.value; syncUI(); savePref(); };
      $('#wbUndo').onclick = undo; $('#wbRedo').onclick = redo;
      $('#wbClear').onclick = () => { if (!strokes.length) return; lastCleared = strokes; strokes = []; redoS = []; persist(); redraw(); toast('Board cleared', 'Undo', () => { strokes = lastCleared; persist(); redraw(); }); };
      $('#wbPaper').onclick = () => { pref.paper = !pref.paper; savePref(); syncUI(); redraw(); };
      $('#wbBig').onclick = () => { pref.big = !pref.big; savePref(); applySize(); setTimeout(fit, 100); };
      
      // Pointer events for modern touch & mouse
      cv.addEventListener('pointerdown', down);
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', cancel);

      // Dedicated TouchEvent fallbacks with { passive: false } to guarantee prevention of mobile gestures
      cv.addEventListener('touchstart', e => {
        if (!window.PointerEvent) down(e);
      }, { passive: false });
      cv.addEventListener('touchmove', e => {
        e.preventDefault(); // Prevents page scrolling behind whiteboard during mobile touch
        if (!window.PointerEvent) move(e);
      }, { passive: false });
      cv.addEventListener('touchend', e => {
        if (!window.PointerEvent) up(e);
      });
      cv.addEventListener('touchcancel', e => {
        if (!window.PointerEvent) cancel(e);
      });

      if (window.ResizeObserver) {
        new ResizeObserver(() => requestAnimationFrame(fit)).observe(stage);
      }
      window.addEventListener('resize', () => { applySize(); fit(); });
      window.addEventListener('orientationchange', () => { setTimeout(() => { applySize(); fit(); }, 200); });

      // drag-to-resize (mobile bottom sheet handle)
      const hd = $('#wbHandle');
      if (hd) {
        const startDrag = e => {
          if (e.cancelable) e.preventDefault();
          el.classList.add('dragging');
          const getY = ev => (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
          const mv = ev => {
            const cy = getY(ev);
            if (typeof cy === 'number') {
              const vh = Math.max(26, Math.min(92, ((window.innerHeight - cy) / window.innerHeight) * 100));
              pref.h = Math.round(vh);
              pref.big = false;
              applySize();
            }
          };
          const end = () => {
            el.classList.remove('dragging');
            window.removeEventListener('pointermove', mv);
            window.removeEventListener('pointerup', end);
            window.removeEventListener('touchmove', mv);
            window.removeEventListener('touchend', end);
            savePref();
            setTimeout(fit, 40);
          };
          window.addEventListener('pointermove', mv, { passive: false });
          window.addEventListener('pointerup', end);
          window.addEventListener('touchmove', mv, { passive: false });
          window.addEventListener('touchend', end);
        };
        hd.addEventListener('pointerdown', startDrag);
        hd.addEventListener('touchstart', startDrag, { passive: false });
      }
      applySize(); syncUI();
    }
    function applySize() {
      if (el) {
        el.classList.toggle('expanded', !!pref.big);
        el.style.height = pref.big ? '94vh' : (window.innerWidth < 768 ? '85vh' : '82vh');
      }
      const bigBtn = $('#wbBig');
      if (bigBtn) bigBtn.classList.toggle('active', !!pref.big);
      setTimeout(fit, 60);
    }
    function setTool(t) { pref.tool = t; savePref(); syncUI(); }
    function syncUI() {
      $('#wbPen').classList.toggle('active', pref.tool === 'pen'); $('#wbEraser').classList.toggle('active', pref.tool === 'eraser');
      $$('.swatch', el).forEach(s => s.classList.toggle('active', pref.tool === 'pen' && s.dataset.c === pref.color));
      const sz = $('#wbSize'), er = pref.tool === 'eraser';
      sz.min = er ? 6 : 1; sz.max = er ? 80 : 30; sz.value = pref[pref.tool];
      $('#wbVal').textContent = pref[pref.tool];
      const d = Math.min(28, pref[pref.tool]), p = $('#wbPrev');
      p.style.width = p.style.height = d + 'px';
      p.style.background = er ? 'transparent' : (pref.color === 'ink' ? '#f1f3ff' : pref.color);
      p.style.border = er ? '1.5px dashed var(--muted)' : 'none';
      stage.classList.toggle('paper', pref.paper); stage.classList.toggle('dark', !pref.paper); stage.classList.toggle('erasing', er);
      $('#wbPaper').classList.toggle('active', pref.paper);
      $('#wbUndo').disabled = !strokes.length; $('#wbRedo').disabled = !redoS.length;
      $('#wbUndo').style.opacity = strokes.length ? 1 : .4; $('#wbRedo').style.opacity = redoS.length ? 1 : .4;
      $('#wbEmpty').style.opacity = strokes.length || cur ? 0 : 1;
    }
    function fit() {
      if (!stage || !cv) return;
      const newW = stage.clientWidth, newH = stage.clientHeight;
      if (!newW || !newH) return;
      const newDpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const targetW = Math.round(newW * newDpr);
      const targetH = Math.round(newH * newDpr);
      if (cv.width === targetW && cv.height === targetH && W === newW && H === newH && dpr === newDpr) {
        return; // Size hasn't changed; avoid clearing canvas bitmap
      }
      W = newW; H = newH; dpr = newDpr;
      cv.width = targetW; cv.height = targetH;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      redraw();
    }
    function style(s) {
      ctx.globalCompositeOperation = s.t === 'e' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = ctx.fillStyle = s.t === 'e' ? '#000' : ink(s.c);
      ctx.lineWidth = s.s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    }
    function drawStroke(s) {
      const p = s.p; style(s); ctx.beginPath();
      if (p.length <= 2) { ctx.arc(p[0], p[1], s.s / 2, 0, Math.PI * 2); ctx.fill(); return; }
      ctx.moveTo(p[0], p[1]);
      for (let k = 2; k < p.length - 2; k += 2) ctx.quadraticCurveTo(p[k], p[k + 1], (p[k] + p[k + 2]) / 2, (p[k + 1] + p[k + 3]) / 2);
      ctx.lineTo(p[p.length - 2], p[p.length - 1]); ctx.stroke();
    }
    function redraw() {
      if (!ctx || !cv.width || !cv.height) return;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      strokes.forEach(drawStroke); if (cur) drawStroke(cur);
      syncUI();
    }
    const pos = e => {
      const r = cv.getBoundingClientRect();
      let cx, cy;
      if (e.touches && e.touches.length > 0) {
        cx = e.touches[0].clientX; cy = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
      } else {
        cx = e.clientX; cy = e.clientY;
      }
      return [
        Math.round((cx - r.left) * 10) / 10,
        Math.round((cy - r.top) * 10) / 10
      ];
    };
    function down(e) {
      if (isDrawing) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.cancelable) e.preventDefault();
      isDrawing = true;
      activeId = e.pointerId !== undefined ? e.pointerId : (e.touches && e.touches[0] ? e.touches[0].identifier : 'touch');
      try { if (e.pointerId !== undefined && cv.setPointerCapture) cv.setPointerCapture(e.pointerId); } catch (er) { }
      const er = pref.tool === 'eraser', [x, y] = pos(e);
      cur = { t: er ? 'e' : 'p', c: pref.color, s: pref[pref.tool], p: [x, y] };
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawStroke(cur); $('#wbEmpty').style.opacity = '0';
    }
    function move(e) {
      if (!isDrawing || !cur) return;
      if (activeId !== 'touch' && e.pointerId !== undefined && e.pointerId !== activeId) return;
      if (e.cancelable) e.preventDefault();
      const evs = (e.getCoalescedEvents && typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : [e];
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); style(cur);
      for (const ev of (evs.length ? evs : [e])) {
        const [x, y] = pos(ev), p = cur.p, lx = p[p.length - 2], ly = p[p.length - 1];
        if (Math.abs(x - lx) + Math.abs(y - ly) < 1.2) continue;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
        p.push(x, y);
      }
    }
    function up(e) {
      if (!isDrawing) return;
      if (activeId !== 'touch' && e && e.pointerId !== undefined && e.pointerId !== activeId) return;
      try { if (e && e.pointerId !== undefined && cv.releasePointerCapture) cv.releasePointerCapture(e.pointerId); } catch (er) { }
      if (cur && cur.p && cur.p.length >= 2) {
        strokes.push(cur);
        redoS = [];
        persist();
      }
      cur = null;
      isDrawing = false;
      activeId = null;
      redraw();
    }
    function cancel(e) {
      if (!isDrawing) return;
      try { if (e && e.pointerId !== undefined && cv.releasePointerCapture) cv.releasePointerCapture(e.pointerId); } catch (er) { }
      cur = null;
      isDrawing = false;
      activeId = null;
      redraw();
    }
    function undo() { if (!strokes.length) return; redoS.push(strokes.pop()); persist(); redraw(); }
    function redo() { if (!redoS.length) return; strokes.push(redoS.pop()); persist(); redraw(); }
    function persist() {
      if (!key) return;
      try { if (strokes.length) localStorage.setItem(BK + key, JSON.stringify(strokes)); else localStorage.removeItem(BK + key); }
      catch (e) { toast('⚠️ Whiteboard storage full — clear an old board'); }
    }
    function setKey(k) {
      if (k === key) return;
      key = k; redoS = []; cur = null; isDrawing = false; activeId = null;
      try { strokes = JSON.parse(localStorage.getItem(BK + k) || '[]'); } catch (e) { strokes = []; }
      $('#wbName').textContent = '· ' + (k === 'home' ? 'General' : TMAP[k].title);
      redraw();
    }
    function open() {
      isOpen = true;
      document.body.classList.add('wb-open');
      applySize();
      requestAnimationFrame(() => {
        fit();
        setTimeout(fit, 60);
        setTimeout(fit, 200);
        setTimeout(fit, 450);
      });
    }
    function close() {
      isOpen = false;
      document.body.classList.remove('wb-open');
    }
    function clearAll() { Object.keys(localStorage).filter(k => k.startsWith(BK)).forEach(k => localStorage.removeItem(k)); strokes = []; redoS = []; redraw(); }
    return { build, open, close, toggle: () => isOpen ? close() : open(), setKey, redraw, clearAll, get isOpen() { return isOpen; }, undo, redo, setTool };
  })();

  /* ---------------- Boot ---------------- */
  function boot() {
    applyTheme(); WB.build();
    $('#fab').onclick = WB.open;
    const topWb = $('#topbarWbBtn'); if (topWb) topWb.onclick = WB.toggle;
    const bdrop = $('#wbBackdrop'); if (bdrop) bdrop.onclick = WB.close;
    $('#settingsBtn').onclick = openSettings;
    $('#themeBtn').onclick = () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; applyTheme(); save(); WB.redraw(); };
    document.addEventListener('keydown', e => {
      if ($('.modal-bg')) { if (e.key === 'Escape') closeModal(); return; }
      const tag = (e.target.tagName || '').toLowerCase();
      if (e.key === 'Escape' && WB.isOpen) { WB.close(); return; }
      if (WB.isOpen && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? WB.redo() : WB.undo(); return; }
      if (tag === 'input' || tag === 'textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
      if (!$('#qcard')) return;
      const k = e.key.toLowerCase(), pos = LET.toLowerCase().indexOf(k) >= 0 ? LET.toLowerCase().indexOf(k) : (/^[1-8]$/.test(k) ? +k - 1 : -1);
      if (pos >= 0) { const b = $('#opt-' + pos); if (b && !b.disabled) { b.click(); e.preventDefault(); } }
      else if (e.key === 'Enter') { const a = $('#qAct'); if (a && !a.disabled) { a.click(); e.preventDefault(); } }
    });
    window.addEventListener('hashchange', route);
    route();
    if (!storageOK) setTimeout(() => toast('⚠️ This viewer blocks storage — progress will not be saved. Open the file in Chrome or Safari.', null, null, 7000), 600);
  }
  boot();
})();

  </script>
